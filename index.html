<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="Junior : un mois d'aviseur en stratégie et en commercialisation, pour le prix d'une heure de consultation. / Junior: a month with your strategy and commercialization advisor, for the price of one hour of consulting.">
<script>
(function(){
  var lang = "fr";
  try {
    var saved = localStorage.getItem("junior_lang");
    if (saved === "fr" || saved === "en") {
      lang = saved;
    } else if (navigator.language && navigator.language.slice(0, 2).toLowerCase() !== "fr") {
      lang = "en";
    }
  } catch (e) {}
  location.replace(lang + "/" + location.search + location.hash);
})();
</script>
<style>
  body{ margin: 0; background: #F6EEDB; color: #17140F; font-family: 'Inter', Helvetica, Arial, sans-serif; }
  .wrap{ max-width: 480px; margin: 18vh auto; padding: 0 32px; text-align: center; }
  a{ color: #00895A; }
</style>
</head>
<body>
<noscript>
  <div class="wrap">
    <p><a href="fr/">Continuer en français</a> · <a href="en/">Continue in English</a></p>
  </div>
</noscript>
</body>
</html>
