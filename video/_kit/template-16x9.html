<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Junior 20X</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,80..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="../_kit/kit.css">
<link rel="stylesheet" href="../_kit/kit-16x9.css">
<style>
/* video-specific styles go here */
.s1 .h{position:absolute;left:120px;top:170px;font-size:104px;width:820px}
.s1 svg{position:absolute;left:1000px;top:170px;width:800px;height:720px;overflow:visible}
</style>
</head>
<body data-size="1920x1080" data-duration="60" data-out="junior-20X-fr-16x9">

<!-- ============ S1 · HOOK  0 – 6s ============ -->
<section class="scene s1" style="--in:0s">
 <div class="so" style="--out:5.8s">
  <div class="grid fi" style="--t:0s"></div>
  <img class="watermark" src="../../assets/logo.png" alt="">
  <p class="eyebrow mono fu" style="--t:.25s">Junior 20X · Thème</p>
  <h1 class="h">
    <span class="ln"><span style="--t:.35s">Première ligne</span></span>
    <span class="ln"><span style="--t:.47s"><span class="ul" style="--t:1.3s">du titre.</span></span></span>
  </h1>
  <svg viewBox="0 0 800 720">
    <rect class="bx dr" style="--t:.8s" pathLength="1" x="0" y="0" width="800" height="720"/>
    <text class="sm fi" style="--t:1.2s" x="28" y="44">Fig. 01 · Schéma</text>
  </svg>
  <p class="figcap mono fu" style="--t:.6s">Légende de la figure</p>
  <div class="cart mono fu" style="--t:.5s"><div><small>Projet</small>Junior 20X</div><div><small>Feuille</small>01 / 06</div><div><small>Rév.</small>2026</div></div>
 </div>
</section>

<!-- ... more scenes: paper (default), class="scene blue wipe" for blueprint ... -->

<!-- ============ CLOSER  55.6 – 60s (keep this block identical across the series; only the headline changes) ============ -->
<section class="scene dark closer" style="--in:55.6s">
 <div class="so" style="--out:99s">
  <div class="cmark pop" style="--t:55.85s"><img src="../../assets/logo.png" alt=""><i></i><i class="r"></i></div>
  <h2 class="h">
    <span class="ln"><span style="--t:56.0s">Punchline</span></span>
    <span class="ln"><span style="--t:56.12s">en deux lignes.</span></span>
  </h2>
  <p class="sub mono fi" style="--t:56.7s">Rien à connecter · Rien à migrer · Rien à perdre si vous arrêtez</p>
  <div class="btn-wrap fu" style="--t:57.2s"><span class="btn mono">Faire mon diagnostic →</span></div>
  <p class="url fu" style="--t:57.45s">junior<em>.</em>coach</p>
  <p class="fine mono fi" style="--t:57.7s">Stratégie + commercialisation · dans votre Claude</p>
 </div>
</section>

<!-- sheet border, drawn once -->
<svg class="sheetframe" viewBox="0 0 1920 1080">
  <rect class="dr" style="--t:0s;--d:1.1s" pathLength="1" x="32" y="32" width="1856" height="1016" fill="none" stroke="#8D98A5" stroke-opacity=".55" stroke-width="2"/>
</svg>
<script src="../_kit/kit.js"></script>
</body>
</html>
