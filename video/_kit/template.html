<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,80..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=block" rel="stylesheet">

<body data-duration="30" data-out="junior-10X-fr-9x16">

<!-- ============ S1 · HOOK  0 – 4s ============ -->
<section class="scene" style="--in:0s">
 <div class="so" style="--out:3.8s">
  <div class="grid fi" style="--t:0s"></div>
  <img class="watermark" src="../../assets/logo.png" alt="">
  <p class="eyebrow mono fu" style="--t:.25s">Junior 10X</p>
  <h1 class="h" style="position:absolute;left:80px;top:300px;font-size:128px">
    <span class="ln"><span style="--t:.35s">Première ligne</span></span>
    <span class="ln"><span style="--t:.47s"><span class="ul" style="--t:1.3s">du titre.</span></span></span>
  </h1>
  <div class="cart mono fu" style="--t:.5s"><div><small>Projet</small>Junior 10X</div><div><small>Feuille</small>01 / 04</div><div><small>Rév.</small>2026</div></div>
 </div>
</section>

<!-- ... more scenes: paper (default), class="scene blue wipe" for blueprint ... -->

<!-- ============ CLOSER  25.6 – 30s (keep this block identical across the series; only the headline changes) ============ -->
<section class="scene dark closer" style="--in:25.6s">
 <div class="so" style="--out:99s">
  <div class="cmark pop" style="--t:25.85s"><img src="../../assets/logo.png" alt=""><i></i><i class="r"></i></div>
  <h2 class="h">
    <span class="ln"><span style="--t:26.0s">Punchline</span></span>
    <span class="ln"><span style="--t:26.12s">en deux lignes.</span></span>
  </h2>
  <p class="sub mono fi" style="--t:26.7s">Rien à connecter · Rien à migrer<br>Rien à perdre si vous arrêtez</p>
  <div class="btn-wrap fu" style="--t:27.2s"><span class="btn mono">Faire mon diagnostic →</span></div>
  <p class="url fu" style="--t:27.45s">junior<em>.</em>coach</p>
  <p class="fine mono fi" style="--t:27.7s">Stratégie + commercialisation · dans votre Claude</p>
 </div>
</section>

<!-- sheet border, drawn once -->
<svg class="sheetframe" viewBox="0 0 1080 1920">
  <rect class="dr" style="--t:0s;--d:1.1s" pathLength="1" x="36" y="36" width="1008" height="1848" fill="none" stroke="#8D98A5" stroke-opacity=".55" stroke-width="2"/>
</svg>
<script src="../_kit/kit.js"></script>
