<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire — Junior</title>
<meta name="description" content="Répondez au questionnaire de diagnostic Junior.">
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,80..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script defer src="https://analytics.junior.coach/script.js" data-website-id="924edbc6-ce17-4213-b2d0-e719cdc3e5aa"></script>
<style>
  :root{
    --paper:#E4E8ED;
    --sheet:#F2F5F8;
    --ink:#141A22;
    --graphite:#5C6673;
    --blueprint:#0D3557;
    --blueprint-deep:#092740;
    --line:#B9C2CC;
    --revision:#C42B1C;
    --error: var(--revision);
    --font-display: "Archivo", system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family:"IBM Plex Mono",monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  .wrap{ width: min(900px, 100% - 2.6rem); margin-inline: auto; }

  /* ---------- header ---------- */
  .masthead{ border-bottom: 1px solid var(--line); }
  .masthead .wrap{ display: flex; align-items: center; gap: 1.4rem; height: 62px; }
  .brand{ display: flex; align-items: center; gap: .6rem; text-decoration: none; color: inherit; }
  .brand-logo{ height: 22px; width: auto; display: block; }
  .mark{
    font-family:"Archivo",sans-serif;font-weight:800;font-variation-settings:"wdth" 84;
    letter-spacing:.16em;font-size:.95rem;text-decoration:none;
  }
  .tagline{
    font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--graphite);
    border-left:1px solid var(--line);padding-left:1.4rem;
  }
  .masthead nav{ margin-left: auto; display: flex; align-items: center; gap: 1.4rem; }
  .lang{ font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-decoration:none;color:var(--graphite); }
  .lang:hover{ color: var(--ink); }

  main.wrap{ padding: 3.2rem 0 5rem; }

  main > *{ max-width: 640px; }

  h1.page-title{
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 88;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.05;
    letter-spacing: -0.018em;
    margin: 0 0 .6rem;
  }
  p.page-sub{
    color: var(--graphite);
    font-size: .93rem;
    line-height: 1.7;
    margin: 0 0 2.2rem;
    max-width: 56ch;
  }

  .message-card{
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 2rem;
    text-align: center;
  }
  .message-card p{ margin: 0; font-size: .9rem; }

  .dimension{ margin-bottom: 2.4rem; }
  .dimension h2{
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 90;
    font-size: 1.08rem;
    font-weight: 700;
    margin: 0 0 1rem;
    padding-bottom: .6rem;
    border-bottom: 1px solid var(--line);
  }

  .question{ margin-bottom: 1.7rem; }
  .question > .q-label{
    font-size: .9rem;
    margin-bottom: .8rem;
    line-height: 1.6;
  }

  .scale{
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
  }
  .scale label{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .25rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: .66rem;
    color: var(--graphite);
    cursor: pointer;
    width: 2.1rem;
  }
  .scale input{ margin: 0; accent-color: var(--blueprint); width: 1.1rem; height: 1.1rem; cursor: pointer; }
  .scale-ends{ display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: .66rem; color: var(--graphite); margin-top: .4rem; max-width: 100%; }

  textarea{
    width: 100%;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: .92rem;
    padding: .75rem .85rem;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--ink);
    min-height: 90px;
    resize: vertical;
  }
  textarea:focus{ outline: 2px solid var(--revision); outline-offset: 1px; border-color: var(--ink); }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    text-decoration: none;
    padding: .72rem 1.15rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: .76rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--sheet);
    border-color: var(--ink);
    cursor: pointer;
    border-radius: 0;
    transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
  }
  .btn:hover{ background: transparent; color: var(--ink); transform: translateY(-1px); }
  .btn:disabled{ opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn:focus-visible{ outline: 2px solid var(--revision); outline-offset: 3px; }

  .submit-row{ margin-top: 1.3rem; }
  .form-error{ color: var(--revision); font-size: .8rem; margin-top: .9rem; display: none; }
  .form-error.show{ display: block; }

  #app-loading{ color: var(--graphite); font-size: .9rem; }
  [hidden]{ display: none !important; }

  :focus-visible{ outline: 2px solid var(--revision); outline-offset: 3px; }

  @media (max-width: 640px){
    .tagline{ display: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="../assets/logo.png" alt="">
      <span class="mark">JUNIOR</span>
    </a>
    <span class="tagline">Questionnaire</span>
    <nav>
      <a class="lang" id="lang-switch" href="../en/diagnostic-respond.html" onclick="try{localStorage.setItem('junior_lang','en')}catch(e){}">EN</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="app-loading">Chargement…</div>

  <div id="invalid-view" hidden>
    <div class="message-card"><p id="invalid-message">Lien invalide.</p></div>
  </div>

  <div id="already-view" hidden>
    <div class="message-card"><p>Merci, vos réponses ont déjà été soumises.</p></div>
  </div>

  <div id="done-view" hidden>
    <div class="message-card"><p>Merci ! Vos réponses ont été enregistrées.</p></div>
  </div>

  <div id="form-view" hidden>
    <h1 class="page-title" id="form-title">Questionnaire</h1>
    <p class="page-sub" id="form-sub"></p>
    <form id="questionnaire-form"></form>
    <div class="form-error" id="submit-error">L'envoi a échoué. Veuillez réessayer.</div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:8787"
    : "https://api.junior.coach";

  // Keep the language switcher pointed at the same respondent link when one is present.
  var switchLink = document.getElementById("lang-switch");
  if (switchLink) switchLink.href = switchLink.getAttribute("href") + location.search;

  function show(id){
    ["app-loading", "invalid-view", "already-view", "done-view", "form-view"].forEach(function(v){
      document.getElementById(v).hidden = (v !== id);
    });
  }

  var params = new URLSearchParams(location.search);
  var token = params.get("token");

  if (!token) {
    document.getElementById("invalid-message").textContent = "Lien invalide.";
    show("invalid-view");
    return;
  }

  var answersKey = "diagnostic_answers_" + token;
  var answers = {};
  try {
    answers = JSON.parse(localStorage.getItem(answersKey)) || {};
  } catch (e) {
    answers = {};
  }

  // TEMPORARY: GET /api/diagnostic/respond/:token isn't built yet (placeholder
  // API only, see conversation) — bypass the real request so the
  // questionnaire can be tested locally. Pass ?offer=commercial|strategique
  // to test a single volet; defaults to "combo" (both). Restore the
  // commented-out fetch() below once a real endpoint exists.
  loadQuestions(params.get("offer") || "combo", "Répondant test");

  /*
  fetch(API_BASE + "/api/diagnostic/respond/" + encodeURIComponent(token))
    .then(function(res){
      if (res.status === 404) { showInvalid(); return null; }
      if (!res.ok) throw new Error("request_failed");
      return res.json();
    })
    .then(function(data){
      if (!data) return;
      if (data.alreadySubmitted) {
        show("already-view");
        return;
      }
      loadQuestions(data.offer, data.respondentName);
    })
    .catch(function(){
      showInvalid();
    });
  */

  function showInvalid(){
    document.getElementById("invalid-message").textContent = "Lien invalide ou expiré.";
    show("invalid-view");
  }

  function loadQuestions(offer, respondentName){
    var files = offer === "combo"
      ? ["../diagnostic-questions/fr/commercial.json", "../diagnostic-questions/fr/strategique.json"]
      : ["../diagnostic-questions/fr/" + offer + ".json"];

    Promise.all(files.map(function(f){ return fetch(f).then(function(r){ return r.json(); }); }))
      .then(function(docs){
        renderForm(docs, respondentName);
        show("form-view");
      })
      .catch(function(){
        showInvalid();
      });
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderForm(docs, respondentName){
    document.getElementById("form-title").textContent = docs.map(function(d){ return d.title; }).join(" + ");
    document.getElementById("form-sub").textContent = "Bonjour " + respondentName + ". Répondez à chaque question du mieux que vous pouvez; vos réponses sont sauvegardées automatiquement.";

    var form = document.getElementById("questionnaire-form");
    form.innerHTML = "";

    docs.forEach(function(doc){
      if (docs.length > 1) {
        var volet = document.createElement("h2");
        volet.style.fontFamily = "var(--font-display)";
        volet.style.margin = "0 0 20px";
        volet.textContent = "Volet " + doc.title.replace(/^Diagnostic /, "");
        form.appendChild(volet);
      }

      doc.dimensions.forEach(function(dim){
        var section = document.createElement("section");
        section.className = "dimension";
        var h2 = document.createElement("h2");
        h2.textContent = dim.label;
        section.appendChild(h2);

        dim.questions.forEach(function(q){
          var qWrap = document.createElement("div");
          qWrap.className = "question";
          var label = document.createElement("div");
          label.className = "q-label";
          label.textContent = q.label;
          qWrap.appendChild(label);

          if (q.type === "scale") {
            var scale = document.createElement("div");
            scale.className = "scale";
            for (var i = 1; i <= 10; i++) {
              var lbl = document.createElement("label");
              var input = document.createElement("input");
              input.type = "radio";
              input.name = q.id;
              input.value = String(i);
              if (String(answers[q.id]) === String(i)) input.checked = true;
              input.addEventListener("change", function(){
                answers[q.id] = Number(this.value);
                persist();
              });
              lbl.appendChild(input);
              var num = document.createElement("span");
              num.textContent = i;
              lbl.appendChild(num);
              scale.appendChild(lbl);
            }
            qWrap.appendChild(scale);
            var ends = document.createElement("div");
            ends.className = "scale-ends";
            ends.innerHTML = "<span>1 — Pas du tout</span><span>10 — Totalement</span>";
            qWrap.appendChild(ends);
          } else {
            var textarea = document.createElement("textarea");
            textarea.name = q.id;
            textarea.value = answers[q.id] || "";
            textarea.addEventListener("input", function(){
              answers[q.id] = this.value;
              persist();
            });
            qWrap.appendChild(textarea);
          }

          section.appendChild(qWrap);
        });

        form.appendChild(section);
      });
    });

    var submitRow = document.createElement("div");
    submitRow.className = "submit-row";
    var submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "btn";
    submitBtn.id = "submit-answers-btn";
    submitBtn.textContent = "Soumettre mes réponses";
    submitRow.appendChild(submitBtn);
    form.appendChild(submitRow);

    submitBtn.addEventListener("click", function(){
      submitAnswers(submitBtn);
    });
  }

  function persist(){
    localStorage.setItem(answersKey, JSON.stringify(answers));
  }

  function submitAnswers(btn){
    var errorEl = document.getElementById("submit-error");
    errorEl.classList.remove("show");
    btn.disabled = true;

    // TEMPORARY: POST /api/diagnostic/respond/:token isn't built yet
    // (placeholder API only, see conversation) — bypass the real request so
    // the flow can be tested locally. Restore the commented-out fetch()
    // below once a real endpoint exists.
    setTimeout(function(){
      localStorage.removeItem(answersKey);
      show("done-view");
    }, 250);

    /*
    fetch(API_BASE + "/api/diagnostic/respond/" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answers: answers })
    })
      .then(function(res){
        if (!res.ok) throw new Error("request_failed");
        return res.json();
      })
      .then(function(){
        localStorage.removeItem(answersKey);
        show("done-view");
      })
      .catch(function(){
        errorEl.classList.add("show");
        btn.disabled = false;
      });
    */
  }
})();
</script>

</body>
</html>
